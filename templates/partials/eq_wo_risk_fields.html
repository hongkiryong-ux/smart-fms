{# 설비 정비의뢰 — 협력사 잠재위험·안전작업 대책 (접수 버튼 위) #}
<div class="eq-wo-risk-fields" hidden>
  <p class="eq-wo-risk-hint">협력사별 잠재위험·안전작업 대책 (시설섹션 기본값 · 수정 가능)</p>
  <label>잠재위험 내용
    <textarea name="hazard_content" rows="4" class="eq-wo-hazard"
              placeholder="협력사를 선택하면 자동으로 채워집니다"></textarea>
  </label>
  <label>안전작업 대책
    <textarea name="safety_measures" rows="4" class="eq-wo-safety"
              placeholder="협력사를 선택하면 자동으로 채워집니다"></textarea>
  </label>
  <label class="eq-wo-grade-field">위험도
    <input type="text" name="risk_grade" class="eq-wo-grade" maxlength="20"
           placeholder="예: 상 / 중 / 하" />
  </label>
</div>
